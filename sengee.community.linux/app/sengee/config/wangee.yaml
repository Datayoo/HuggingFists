
#coreThreadPoolSize
#maxThreadPoolSize
#threadKeepAliveTime: 32
#cycleCheckParallels: 2
jobTypeConfigurations:
  - jobType: 'oyez'
    sourceType: 'oyez'
    sourceSelectorClazz: 'org.datayoo.sengee.selector.SengeeJobSourceSelector'
    taskQueuingTimeOut: 60000
  - jobType: 'oyez.debug'
    sourceType: 'oyez.debug'
    sourceSelectorClazz: 'org.datayoo.sengee.selector.SengeeJobSourceSelector'
    taskQueuingTimeOut: 60000
    #sourceSelectorClazz
    #taskQueuingTimeOut
  - jobType: 'oyez.stream'
    sourceType: 'oyez.stream'
    sourceSelectorClazz: 'org.datayoo.sengee.selector.SengeeJobSourceSelector'
    taskQueuingTimeOut: 60000
  - jobType: 'oyez.dura'
    sourceType: 'oyez.dura'
    sourceSelectorClazz: 'org.datayoo.sengee.selector.SengeeJobSourceSelector'
  - jobType: 'crawlerJob'
    sourceType: 'crawler'
#queuingTimeoutConfiguration:

#GeeSourceManager Configuration
gsmConfiguration:
  yeeProps:
    yc.srv.address: datayoo.sengee
    yc.srv.port: 8823
    yc.calling.expiration: 2000
  #rmsClazz
  #rmsPropFiles
  gspConfigurations:
    - sourceType: 'crawler'
      minPoolSize: 2
      maxPoolSize: 16
      #availableRatioLimit
      #propsFile
      #scaleOutCycleTimeLimit
      #taskQueueSize
    - sourceType: 'oyez'
      minPoolSize: 20
      maxPoolSize: 20
    - sourceType: 'oyez.debug'
      minPoolSize: 20
      maxPoolSize: 20
    - sourceType: 'oyez.stream'
      minPoolSize: 2
      maxPoolSize: 20
    - sourceType: 'oyez.dura'
      minPoolSize: 2
      maxPoolSize: 20
      #availableRatioLimit
      #propsFile
      #scaleOutCycleTimeLimit
      #taskQueueSize
